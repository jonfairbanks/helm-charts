apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "rick.fullname" . }}-test-connection"
  labels:
    {{- include "rick.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  automountServiceAccountToken: false
  containers:
    - name: wget
      image: busybox:1.37.0
      command: ["wget"]
      args: ["--spider", "{{ include "rick.fullname" . }}:{{ .Values.service.port }}"]
  restartPolicy: Never
